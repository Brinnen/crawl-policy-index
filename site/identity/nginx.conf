server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name crawlpolicyindex.org www.crawlpolicyindex.org;

    root /var/www/cpi;
    index index.html;

    location = /bot {
        return 301 /bot/;
    }

    location /bot/ {
        try_files $uri $uri/ /bot/index.html =404;
    }

    include snippets/cpi-snapshot.conf;

    location / {
        try_files $uri $uri/ =404;
    }
}
