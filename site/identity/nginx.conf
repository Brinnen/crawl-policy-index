server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/cpi;
    index index.html;

    location = /bot {
        return 301 /bot/;
    }

    location /bot/ {
        try_files $uri $uri/ /bot/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
