panel:
  version: "tranco1000"
  path: "data/panel-tranco1000.csv"

storage:
  backend: "fs"
  root: "../data/store"

database:
  dsn: "postgresql://cpi:cpi@localhost:5432/cpi"

fetcher:
  resources: [robots_txt]
  window_start_utc: "02:00"
  window_hours: 6
  shards: 1
  workers_per_shard: 64
  global_rate_limit_rps: 50
  per_host_inflight: 1
  per_ip_concurrent: 4
  per_asn_concurrent: 20
  timeouts:
    connect_s: 5
    tls_s: 10
    total_s: 15
  max_redirects: 3
  size_caps_bytes:
    robots_txt: 1048576
    llms_txt: 2097152
    sitemap_xml: 10485760
  retry:
    attempts: 1
    backoff_s: [30, 90]
  user_agent: "CrawlPolicyIndex/1.0 (+https://crawlpolicyindex.org/bot)"
  fetcher_version: "0.1.0"
