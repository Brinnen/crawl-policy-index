panel:
  version: "sites1m"
  path: "data/panel-sites1m.csv"

storage:
  backend: "fs"
  root: "../data/store"

database:
  dsn: "postgresql://cpi:cpi@localhost:5432/cpi"

fetcher:
  resources: [robots_txt, html_home]
  window_start_utc: "02:00"
  window_hours: 18
  shards: 1
  workers_per_shard: 64
  global_rate_limit_rps: 80
  per_host_inflight: 1
  per_ip_concurrent: 4
  per_asn_concurrent: 32
  timeouts:
    connect_s: 5
    tls_s: 10
    total_s: 15
  max_redirects: 3
  size_caps_bytes:
    robots_txt: 1048576
    llms_txt: 2097152
    sitemap_xml: 10485760
    html_home: 524288
  retry:
    attempts: 1
    backoff_s: [30, 90]
  user_agent: "CrawlPolicyIndex/1.0 (+https://crawlpolicyindex.org/bot)"
  fetcher_version: "0.2.0"
