  # ------------------------------------------------------------------
  # ByteDance
  # ------------------------------------------------------------------
  - slug: bytedance-bytespider
    ua_token: Bytespider
    display_name: Bytespider
    operator: ByteDance
    purpose: training
    confidence: high
    notes: >
      Among the most frequently blocked tokens in the wild, largely on
      reputational grounds rather than considered policy. Worth a
      dedicated cut in the report.

  # ------------------------------------------------------------------
  # Amazon
  # ------------------------------------------------------------------
  - slug: amazon-amazonbot
    ua_token: Amazonbot
