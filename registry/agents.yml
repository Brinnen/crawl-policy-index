# =====================================================================
# GAPS TO CLOSE BEFORE LAUNCH
#
#  1. xAI / Grok — believed to operate a crawler; token not established
#     here. Find the operator's own documentation before adding it.
#     Do NOT add a token sourced only from a blog post.
#
#  2. DeepSeek, Alibaba/Qwen, Zhipu — Chinese labs are underrepresented
#     in every Western blocklist, which is itself a publishable finding.
#     Research properly; a gap in the registry becomes a false zero in
#     the charts, and a false zero is worse than an admitted unknown.
#
#  3. Cloudflare pay-per-crawl signalling. Since 2026 a site's crawl
#     policy is not fully expressed in robots.txt — some of it lives in
#     HTTP 402 responses and signed-agent headers. v1 measures robots.txt
#     only and `docs/methodology.md` must say so in plain words. Scoping
#     a v2 that also observes the 402 layer is the single most valuable
#     follow-on to this registry.
#
#  4. SEO crawlers (SemrushBot, AhrefsBot, etc.) are deliberately absent.
#     They are not AI agents and including them would muddy every
#     aggregate. Resist the request when it comes.
# =====================================================================
